[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taiyiflow-sdk"
version = "0.1.0"
description = "Async Python SDK for TaiyiFlow agents and digital workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "websockets>=12,<16",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.49,<2",
]
worker = [
  "cryptography>=42",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.8",
  "taiyiflow-sdk[worker]",
]
integration = [
  "taiyiflow-sdk[browser,worker]",
]

[project.scripts]
taiyiagent-worker = "taiyiagent.worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taiyiagent"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a real TaiyiFlow backend and explicit environment configuration",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["taiyiagent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["S105", "S106"]
"tests/*" = ["S103", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["taiyiagent"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["websockets.*", "yaml.*"]
ignore_missing_imports = true
